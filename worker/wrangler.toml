name = "mercy-mills-orders"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Non-secret config. Edit these to match your setup.
[vars]
FROM_NAME = "Mercy Mill Sourdough"
FROM_EMAIL = "orders@mercymillsourdough.com"   # must be on your Resend-verified domain
SITE_URL = "https://mercymillsourdough.com"
# Every address the website can be reached at. Orders from a page on any other
# address are refused, so a missing one here means "couldn't reach the server"
# for customers who arrive that way. Firebase also serves the site at its own
# .web.app and .firebaseapp.com addresses, so those are listed too.
# `npm test` checks that this list covers all of them.
ALLOW_ORIGIN = "https://mercymillsourdough.com,https://www.mercymillsourdough.com,https://mercy-mills-sourdough.web.app,https://mercy-mills-sourdough.firebaseapp.com"

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SIGNING_SECRET   (any long random string)
#   npx wrangler secret put OWNER_EMAIL      (mom's email address)

# REQUIRED: orders, decisions and the one-time security codes live here.
# Without it, Accept/Decline refuse to work (fail closed) rather than trusting
# the emailed link alone. Create the namespace:
#   npx wrangler kv namespace create ORDERS
# then paste the printed id below and uncomment these three lines.
[[kv_namespaces]]
binding = "ORDERS"
id = "b69a4d929e4b46ed9641bf3bfdabff9e"
